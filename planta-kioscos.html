<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maderable Kiosco — Planta</title>
  <style>
    :root {
      --bg:      #0f0f0f;
      --card:    #1e1e1e;
      --card2:   #252525;
      --border:  #333;
      --accent:  #FFD600;
      --text:    #f0f0f0;
      --muted:   #888;
      --green:   #22c55e;
      --yellow:  #eab308;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --accent-dim: rgba(255,214,0,0.1);
      --panel: #1e1e1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ═══ SCREEN COMMON ═══ */
    .screen {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ═══ PANTALLA (planta2 style) ═══ */
    .pantalla { display: none; flex-direction: column; min-height: 100vh; }
    .pantalla.activa { display: flex; }

    /* ═══ LOGIN HEADER ═══ */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 52px; flex-shrink: 0;
      background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .header-logo { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
      color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }

    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      display: inline-block; animation: pulso 2s infinite; }
    @keyframes pulso { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ═══ CENTRADO ═══ */
    .centrado { flex: 1; padding: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; }

    /* ═══ LABEL ═══ */
    .lbl {
      font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 10px;
    }

    /* ═══ BOTONES (táctiles) ═══ */
    .btn {
      width: 100%; min-height: 68px; border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; user-select: none;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active  { transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #0f0f0f; }

    /* ═══ SELECT ═══ */
    .select-wrap { position: relative; width: 100%; }
    .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    select.select-big {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 40px 14px 16px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none;
      appearance: none; -webkit-appearance: none; cursor: pointer;
    }
    select.select-big option { background: var(--card); }

    /* ═══ PIN ═══ */
    .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 4px 0 16px; }
    .pin-dot  { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
      background: transparent; transition: all 0.15s; }
    .pin-dot.lleno { background: var(--accent); border-color: var(--accent); }

    .pin-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: 100%; max-width: 300px;
    }
    .pin-key {
      height: 70px; min-width: 70px; background: var(--card2); border: 1.5px solid var(--border);
      border-radius: 10px; font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700;
      color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
      user-select: none; transition: background 0.1s, transform 0.08s, border-color 0.1s;
    }
    .pin-key:active { background: var(--accent-dim); border-color: var(--accent); transform: scale(0.94); }
    .pin-key.del   { font-size: 18px; color: var(--muted); }
    .pin-key.clear { font-size: 18px; color: #ef4444; }

    /* ═══ SHAKE ═══ */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-10px); }
      40%     { transform: translateX(10px); }
      60%     { transform: translateX(-7px); }
      80%     { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }

    /* ═══ TOAST ═══ */
    .toast-container { position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

    /* ═══ MENU SCREEN ═══ */
    .menu-container {
      width: 100%;
      max-width: 1200px;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .menu-logo {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .menu-user {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-name {
      font-size: 13px;
      color: var(--text);
    }

    .btn-logout {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-logout:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      padding: 0 20px;
    }

    .card-flujo {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      min-height: 300px;
      justify-content: space-between;
    }

    .card-flujo:hover {
      background: var(--card);
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .card-icon {
      font-size: 48px;
      line-height: 1;
    }

    .card-title {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .btn-abrir {
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
      align-self: stretch;
    }

    .btn-abrir:hover {
      opacity: 0.9;
    }

    /* ═══ SUBMENU SCREEN ═══ */
    .submenu-screen {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .submenu-screen.active {
      display: flex;
    }

    .submenu-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .submenu-title {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .submenu-buttons {
      display: flex;
      gap: 16px;
      flex-direction: column;
    }

    .btn-submenu {
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .btn-submenu:hover {
      opacity: 0.9;
    }

    .btn-submenu-volver {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      margin-top: 16px;
    }

    .btn-submenu-volver:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ═══ FLUJO MODAL ═══ */
    .flujo-modal {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      padding: 20px;
    }

    .flujo-modal.active {
      display: flex;
    }

    .flujo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .flujo-title {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-volver {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .btn-volver:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .flujo-content {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    .placeholder-text {
      font-size: 16px;
      color: var(--muted);
      text-align: center;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .login-card,
      .submenu-card {
        padding: 32px 24px;
      }

      .flujo-content {
        padding: 20px;
      }

      .menu-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .menu-user {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════
  PANTALLA 1 — LOGIN OPERARIO
══════════════════════════════════════════════════════════════════════ -->
<div id="pantalla-login" class="pantalla activa">
  <div class="header">
    <span class="header-logo">○ Maderable · Planta</span>
    <span class="live-dot"></span>
  </div>
  <div class="centrado" style="max-width:340px;margin:0 auto;width:100%;">

    <div style="width:100%;">
      <span class="lbl">Operario</span>
      <div class="select-wrap">
        <select id="sel-empleado" class="select-big">
          <option value="">— Seleccioná tu nombre —</option>
        </select>
      </div>
    </div>

    <div style="width:100%;text-align:center;">
      <span class="lbl" style="text-align:center;">PIN</span>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
      </div>
      <div class="pin-grid" id="pin-grid">
        <button class="pin-key" onclick="pinTap('1')">1</button>
        <button class="pin-key" onclick="pinTap('2')">2</button>
        <button class="pin-key" onclick="pinTap('3')">3</button>
        <button class="pin-key" onclick="pinTap('4')">4</button>
        <button class="pin-key" onclick="pinTap('5')">5</button>
        <button class="pin-key" onclick="pinTap('6')">6</button>
        <button class="pin-key" onclick="pinTap('7')">7</button>
        <button class="pin-key" onclick="pinTap('8')">8</button>
        <button class="pin-key" onclick="pinTap('9')">9</button>
        <button class="pin-key clear" onclick="pinClear()">✕</button>
        <button class="pin-key" onclick="pinTap('0')">0</button>
        <button class="pin-key del"   onclick="pinBorrar()">⌫</button>
      </div>
    </div>

    <div style="width:100%;">
      <button class="btn btn-primary" id="btn-entrar" onclick="autenticar()">ENTRAR</button>
    </div>
    <div id="login-error" style="font-family:'Space Mono',monospace;font-size:12px;
      color:var(--red);text-align:center;min-height:18px;"></div>

  </div>
</div>

<!-- ════ SCREEN: MENÚ PRINCIPAL ════ -->
<div id="pantalla-menu" class="screen">
  <div class="menu-container">
    <div class="menu-header">
      <div class="menu-logo">⬡ MADERABLE KIOSCO</div>
      <div class="menu-user">
        <span class="user-name" id="nombre-operario">Juan García</span>
        <button class="btn-logout" onclick="salir()">Salir</button>
      </div>
    </div>

    <div class="cards-grid" id="menu-cards-container">
      <!-- Cards generadas dinámicamente -->
    </div>
  </div>
</div>

<!-- ════ SCREEN: SUBMENU ════ -->
<div id="screen-submenu" class="submenu-screen">
  <div class="submenu-card">
    <div class="submenu-title" id="submenu-title">Seleccionar opción</div>
    <div class="submenu-buttons" id="submenu-buttons-container">
      <!-- Botones generados dinámicamente -->
    </div>
    <button class="btn-submenu-volver" onclick="volverAlMenu()">← Volver</button>
  </div>
</div>

<!-- ════ FLUJO: DESPACHOS ════ -->
<div id="screen-despachos" class="flujo-modal">
  <div class="flujo-header">
    <div class="flujo-title">Despachos</div>
    <button class="btn-volver" onclick="volverAlMenu('despachos')">← Volver</button>
  </div>
  <div class="flujo-content" id="despachos-content">
    <div class="placeholder-text">Flujo de Despachos (Fase 2)</div>
  </div>
</div>

<!-- ════ FLUJO: TERCERIZADOS ════ -->
<div id="screen-tercerizados" class="flujo-modal">
  <div class="flujo-header">
    <div class="flujo-title">Tercerizados</div>
    <button class="btn-volver" onclick="volverAlMenu('tercerizados')">← Volver</button>
  </div>
  <div class="flujo-content" id="tercerizados-content">
    <div class="placeholder-text">Flujo de Tercerizados (Fase 3)</div>
  </div>
</div>

<!-- ════ FLUJO: RECEPCIONES OC ════ -->
<div id="screen-oc" class="flujo-modal">
  <div class="flujo-header">
    <div class="flujo-title">Recepciones OC</div>
    <button class="btn-volver" onclick="volverAlMenu('oc')">← Volver</button>
  </div>
  <div class="flujo-content" id="oc-content">
    <div class="placeholder-text">Flujo de Recepciones OC (Fase 3)</div>
  </div>
</div>

<!-- ════ FLUJO: KITTING ════ -->
<div id="screen-kitting" class="flujo-modal">
  <div class="flujo-header">
    <div class="flujo-title">Kitting</div>
    <button class="btn-volver" onclick="volverAlMenu('kitting')">← Volver</button>
  </div>
  <div class="flujo-content" id="kitting-content">
    <div class="placeholder-text">Flujo de Kitting (Fase 2)</div>
  </div>
</div>

<script>
  // ═══ CONFIGURACIÓN DE FLUJOS ═══
  const FLUJOS_CONFIG = [
    {
      id: 'despachos',
      nombre: 'Despachos',
      icono: '🚚',
      descripcion: 'Gestionar bultos, envíos y imprimir etiquetas 60×30mm',
      activo: true,
      submenu: null
    },
    {
      id: 'tercerizados',
      nombre: 'Tercerizados',
      icono: '📦',
      descripcion: 'Despachar, recibir y retornar piezas de Baru / Rodart',
      activo: true,
      submenu: [
        { id: 'baru', nombre: 'Baru' },
        { id: 'rodart', nombre: 'Rodart' }
      ]
    },
    {
      id: 'oc',
      nombre: 'Recepciones OC',
      icono: '📥',
      descripcion: 'Escanear y confirmar llegada de órdenes de compra',
      activo: true,
      submenu: null
    },
    {
      id: 'kitting',
      nombre: 'Kitting',
      icono: '🔩',
      descripcion: 'Armar órdenes de servicio y marcar líneas completas',
      activo: true,
      submenu: null
    },
    {
      id: 'madera',
      nombre: 'Madera Maciza',
      icono: '🪵',
      descripcion: 'Gestión de madera maciza',
      activo: false,
      submenu: null
    },
    {
      id: 'placas',
      nombre: 'Gestión Placas',
      icono: '📋',
      descripcion: 'Control de placas de cajas',
      activo: false,
      submenu: null
    }
  ];

  // ═══ ESTADO GLOBAL ═══
  let _sesion = null;
  let _flujoActual = null;
  let _subopcionActual = null;
  let _timeoutHandle = null;
  let _pin = '';
  let empleadoActual = null;

  // ═══ API HELPERS ═══
  async function apiGet(action, qs = '') {
    const r = await fetch(`/api/tiempos?action=${action}${qs ? '&' + qs : ''}`);
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); }
    return r.json();
  }

  function toast(msg, color = '') {
    let c = document.getElementById('toast-container');
    if (!c) { c = document.createElement('div'); c.id = 'toast-container'; c.className = 'toast-container'; document.body.appendChild(c); }
    const t = document.createElement('div');
    t.style.cssText = 'background:' + (color || 'var(--card)') + ';color:var(--text);padding:12px 20px;border-radius:8px;font-family:"Space Mono",monospace;font-size:12px;pointer-events:auto;opacity:0;transition:opacity 0.3s;';
    t.textContent = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.style.opacity = '1');
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
  }

  // ═══ CARGAR EMPLEADOS ═══
  async function cargarEmpleados() {
    try {
      const { empleados } = await apiGet('empleados');
      const sel = document.getElementById('sel-empleado');
      (empleados || []).forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.dataset.cedula = e.cedula;
        opt.dataset.nombre = e.nombre;
        opt.dataset.entrada = e.horario_entrada || '08:00';
        opt.textContent = e.nombre;
        sel.appendChild(opt);
      });
    } catch (e) {
      toast('Sin conexión al servidor', 'var(--red)');
    }
  }

  // ═══ PIN ENTRADA ═══
  function pinTap(d) {
    if (_pin.length >= 4) return;
    _pin += d;
    renderPin();
    if (_pin.length === 4) setTimeout(autenticar, 150);
  }

  function pinBorrar() {
    _pin = _pin.slice(0, -1);
    renderPin();
  }

  function pinClear() {
    _pin = '';
    renderPin();
  }

  function renderPin() {
    for (let i = 0; i < 4; i++)
      document.getElementById('pd' + i).classList.toggle('lleno', i < _pin.length);
  }

  // ═══ AUTENTICACIÓN ═══
  async function autenticar() {
    const sel = document.getElementById('sel-empleado');
    const opt = sel.options[sel.selectedIndex];

    if (!sel.value) { setLoginError('Seleccioná tu nombre'); return; }
    if (_pin.length < 4) { setLoginError('Ingresá los 4 dígitos del PIN'); return; }

    const cedulaIngresada = opt.dataset.cedula;
    if (!cedulaIngresada) { setLoginError('Operario sin cédula registrada'); return; }

    setLoginError('');
    document.getElementById('btn-entrar').textContent = 'Ingresando…';
    document.getElementById('btn-entrar').disabled = true;

    let verificado;
    try {
      const resp = await fetch('/api/tiempos?action=verificar-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cedula: cedulaIngresada, pin: _pin }),
      });
      const json = await resp.json();
      if (!resp.ok || !json.ok || !json.empleado) {
        const grid = document.getElementById('pin-grid');
        grid.classList.remove('shake');
        void grid.offsetWidth;
        grid.classList.add('shake');
        pinClear();
        setLoginError(json.error || 'Cédula o PIN incorrectos');
        document.getElementById('btn-entrar').textContent = 'ENTRAR';
        document.getElementById('btn-entrar').disabled = false;
        return;
      }
      verificado = json.empleado;
    } catch (e) {
      console.error('Error de red en login:', e);
      setLoginError('Error de conexión. Verificá el internet.');
      document.getElementById('btn-entrar').textContent = 'ENTRAR';
      document.getElementById('btn-entrar').disabled = false;
      return;
    }

    // Login exitoso: guardar sesión y mostrar menú
    try {
      empleadoActual = {
        id: verificado.id,
        nombre: verificado.nombre,
      };
      _sesion = empleadoActual;
      sessionStorage.setItem('kiosco_sesion', JSON.stringify(empleadoActual));

      // Mostrar nombre en header
      document.getElementById('nombre-operario').textContent = verificado.nombre;

      // Grabar log
      _grabarLog('login', { empleado_id: verificado.id });

      // Generar menú
      generarMenu();

      // Iniciar timeout
      _resetTimeout();

      // Mostrar menú
      ocultarTodos();
      document.getElementById('pantalla-menu').classList.add('active');

    } catch (e) {
      setLoginError('Error: ' + e.message);
    } finally {
      document.getElementById('btn-entrar').textContent = 'ENTRAR';
      document.getElementById('btn-entrar').disabled = false;
    }
  }

  function setLoginError(msg) {
    document.getElementById('login-error').textContent = msg;
  }

  // ═══ GENERACIÓN DE MENÚ ═══
  function generarMenu() {
    const container = document.getElementById('menu-cards-container');
    container.innerHTML = '';

    const flujosFiltrados = FLUJOS_CONFIG.filter(f => f.activo);

    flujosFiltrados.forEach(flujo => {
      const card = document.createElement('div');
      card.className = 'card-flujo';
      card.onclick = () => {
        _flujoActual = flujo.id;
        if (flujo.submenu) {
          mostrarSubmenu(flujo);
        } else {
          abrirFlujo(flujo.id);
        }
      };

      card.innerHTML = `
        <div class="card-icon">${flujo.icono}</div>
        <div class="card-title">${flujo.nombre}</div>
        <div class="card-desc">${flujo.descripcion}</div>
        <button class="btn-abrir" onclick="event.stopPropagation(); abrirFlujo('${flujo.id}');">Abrir →</button>
      `;

      container.appendChild(card);
    });
  }

  // ═══ SUBMENU ═══
  function mostrarSubmenu(flujo) {
    const titleEl = document.getElementById('submenu-title');
    const buttonsEl = document.getElementById('submenu-buttons-container');

    titleEl.textContent = `${flujo.nombre} — Seleccionar proveedor`;
    buttonsEl.innerHTML = '';

    flujo.submenu.forEach(opcion => {
      const btn = document.createElement('button');
      btn.className = 'btn-submenu';
      btn.textContent = opcion.nombre;
      btn.onclick = () => {
        _subopcionActual = opcion.id;
        abrirFlujo(flujo.id, opcion.id);
      };
      buttonsEl.appendChild(btn);
    });

    ocultarTodos();
    document.getElementById('screen-submenu').classList.add('active');
  }

  // ═══ ABRIR FLUJO ═══
  function abrirFlujo(flujoId, subopcion = null) {
    _flujoActual = flujoId;
    _subopcionActual = subopcion;

    // Grabar log
    _grabarLog('abrir_flujo', { flujo_id: flujoId, subopcion: subopcion });

    // Llamar al IIFE del flujo si existe
    if (window[`flujo_${flujoId}`]) {
      window[`flujo_${flujoId}`].cargar(subopcion);
    }

    ocultarTodos();
    document.getElementById(`screen-${flujoId}`).classList.add('active');
  }

  // ═══ VOLVER AL MENÚ ═══
  function volverAlMenu(flujoId = null) {
    if (flujoId) {
      _grabarLog('cerrar_flujo', { flujo_id: flujoId });
    }

    _flujoActual = null;
    _subopcionActual = null;

    ocultarTodos();
    document.getElementById('pantalla-menu').classList.add('active');
  }

  // ═══ LOGOUT ═══
  function salir() {
    _grabarLog('logout', {});

    sessionStorage.removeItem('kiosco_sesion');
    _sesion = null;
    empleadoActual = null;
    _flujoActual = null;
    _subopcionActual = null;

    clearTimeout(_timeoutHandle);

    document.getElementById('sel-empleado').value = '';
    pinClear();

    ocultarTodos();
    document.getElementById('pantalla-login').classList.add('activa');
  }

  // ═══ TIMEOUT (3 MIN) ═══
  function _resetTimeout() {
    clearTimeout(_timeoutHandle);

    _timeoutHandle = setTimeout(() => {
      console.log('[Kiosco] Timeout de 3 minutos — desconectando');
      _grabarLog('timeout', {});
      salir();
    }, 180000); // 3 minutos = 180000ms
  }

  // ═══ LISTENERS PARA RESET DE TIMEOUT ═══
  document.addEventListener('click', _resetTimeout);
  document.addEventListener('keydown', _resetTimeout);

  // ═══ AUDITORÍA ═══
  function _grabarLog(accion, detalles) {
    if (!_sesion) return;

    const payload = {
      empleado_id: _sesion.empleado_id,
      accion: accion,
      detalles: detalles || {},
      timestamp: new Date().toISOString()
    };

    console.log('[Auditoría]', payload);

    // POST /api/tiempos?action=grabar-log-kiosco
    fetch('/api/tiempos?action=grabar-log-kiosco', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.error('[Auditoría Error]', err));
  }

  // ═══ UTILIDADES ═══
  function ocultarTodos() {
    document.querySelectorAll('.screen, .submenu-screen, .flujo-modal').forEach(el => {
      el.classList.remove('active');
    });
    document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
  }

  // ═══ INICIALIZACIÓN ═══
  window.addEventListener('DOMContentLoaded', () => {
    cargarEmpleados();

    const sesionGuardada = sessionStorage.getItem('kiosco_sesion');
    if (sesionGuardada) {
      try {
        _sesion = JSON.parse(sesionGuardada);
        empleadoActual = _sesion;
        document.getElementById('nombre-operario').textContent = _sesion.nombre;
        generarMenu();
        _resetTimeout();
        ocultarTodos();
        document.getElementById('pantalla-menu').classList.add('active');
      } catch (e) {
        console.error('Error restaurando sesión:', e);
      }
    }
  });
</script>

<!-- Importar flujos -->
<script src="/js/kiosco-flujos.js"></script>

</body>
