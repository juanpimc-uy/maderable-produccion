<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despacho · MBLE</title>
<script src="/js/supabase-config.js"></script>
<script src="/js/buscador.js"></script>
<script src="/js/kiosco-modo.js"></script>
<script src="/js/etiquetas.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#1e1e1e;--card:#252525;--border:#2a2a2a;--text:#e8e8e8;--muted:#888;
      --amber:#FFD600;--green:#4ade80;--orange:#ff9d2e;--red:#ef4444;--faint:#1a1a1a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden;display:flex;}
.mono{font-family:'Space Mono',monospace;}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-shrink:0;}
.topbar h1{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.topbar h1 b{color:var(--amber);}
.spacer{flex:1;}
.btn{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--card);color:var(--text);transition:all .15s;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-accent{background:var(--amber);color:#000;border-color:var(--amber);}
.btn-accent:hover{opacity:.85;color:#000;}
.btn-sm{padding:5px 10px;font-size:9px;}
.btn-danger{border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:rgba(239,68,68,.1);}
/* KPIs */
.kpis{display:flex;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0;max-width:1500px;margin:0 auto;width:100%;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;}
.kpi-val{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;}
.kpi-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
/* Alert band */
.alerta-band{background:rgba(239,68,68,.08);border-bottom:1px solid rgba(239,68,68,.2);padding:10px 24px;font-family:'Space Mono',monospace;font-size:11px;color:var(--red);display:flex;align-items:center;gap:8px;flex-shrink:0;max-width:1500px;margin:0 auto;width:100%;}
/* Board */
.board{flex:1;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:0;overflow:hidden;max-width:1500px;margin:0 auto;width:100%;}
.col{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow-y:auto;padding:16px;}
.col:last-child{border-right:none;}
.col-head{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.col-head .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.col-head .cnt{font-size:10px;color:var(--amber);margin-left:auto;}
/* Card */
.dcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;border-left:3px solid var(--border);}
.dcard:hover{border-color:var(--amber);}
.dcard.ok{border-left-color:var(--green);}
.dcard.warn{border-left-color:var(--orange);}
.dcard.err{border-left-color:var(--red);}
.dcard-cod{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:6px;}
.dcard-cod .env-pill{font-size:8px;background:rgba(255,214,0,.1);color:var(--amber);border:1px solid rgba(255,214,0,.3);border-radius:3px;padding:1px 5px;}
.dcard-name{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dcard-prod{font-family:'Space Mono',monospace;font-size:9px;margin-top:4px;}
.dcard-bar{height:4px;background:var(--faint);border-radius:2px;margin-top:6px;overflow:hidden;}
.dcard-bar-fill{height:100%;border-radius:2px;transition:width .3s;}
.dcard-stats{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-top:4px;}
/* Obra group */
.ogroup{margin-bottom:12px;}
.ogroup-head{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:8px;}
/* New card */
.newcard{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;margin-bottom:8px;transition:border-color .15s;}
.newcard:hover{border-color:var(--amber);}
.newcard .plus{font-size:24px;color:var(--amber);margin-bottom:4px;}
.newcard .lbl{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
/* Despachado col */
.drow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--faint);font-size:11px;}
.drow .mono{font-size:10px;}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--amber);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.field{margin-bottom:11px;}
.field label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
.field input,.field select{width:100%;font-family:'Space Mono',monospace;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);outline:none;}
.field input:focus{border-color:var(--amber);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.err-msg{color:var(--red);font-family:'Space Mono',monospace;font-size:11px;margin-top:8px;}
/* Detail modal */
.det-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.det-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;}
.det-cell .lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.det-cell .val{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;}
.bulto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px;}
.bulto{background:var(--faint);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;}
.bulto.done{border-color:var(--green);background:rgba(74,222,128,.06);}
.bulto .bnum{font-family:'Space Mono',monospace;font-weight:700;font-size:10px;color:var(--amber);}
.bulto .bdesc{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bulto .bstatus{margin-top:4px;font-family:'Space Mono',monospace;font-size:9px;}
/* Toast */
.toast{position:fixed;top:16px;right:16px;font-family:'Space Mono',monospace;font-size:11px;padding:10px 18px;border-radius:8px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast-ok{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3);}
.toast-err{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
</style>
<script src="sidebar.js"></script>
</head>
<body>
<div id="sidebar-root"></div>
<div id="main">
  <div class="topbar">
    <h1><b>▤</b> Despacho</h1>
    <span class="spacer"></span>
    <span id="etiq-sel-wrap"></span>
    <button class="btn" disabled title="Próximo lote">Historial</button>
    <button class="btn btn-accent" onclick="abrirNuevoEnvio()">+ Nuevo envío</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="alerta-band"></div>
  <div class="board" id="board">
    <div class="col" id="col-preparar"></div>
    <div class="col" id="col-camion"></div>
    <div class="col" id="col-despachado"></div>
  </div>
</div>

<!-- Modal nuevo envío -->
<div class="overlay" id="ov-nuevo">
  <div class="modal" style="max-width:420px;padding:20px;">
    <div class="modal-title">NUEVO ENVÍO</div>
    <div class="field"><label>Proyecto</label>
      <div style="position:relative;">
        <input id="nv-proy-inp" placeholder="Buscar proyecto..." autocomplete="off">
        <div id="nv-proy-drop"></div>
      </div>
    </div>
    <div class="field"><label>Mueble</label>
      <div style="position:relative;">
        <input id="nv-mueble-inp" placeholder="Elegí primero el proyecto" disabled autocomplete="off">
        <div id="nv-mueble-drop"></div>
      </div>
    </div>
    <div id="nv-prod-aviso" style="margin-bottom:12px;"></div>
    <div class="field"><label>Nombre de la etiqueta</label>
      <input id="nv-nombre" placeholder="Se autocompleta con el mueble">
    </div>
    <div class="field"><label>Cantidad de bultos</label>
      <input id="nv-bultos" type="number" min="1" value="1">
    </div>
    <div id="nv-error" class="err-msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="cerrarNuevo()">Cancelar</button>
      <button class="btn btn-accent" id="nv-btn" onclick="crearEnvio()">Crear e imprimir</button>
    </div>
  </div>
</div>

<!-- Modal detalle -->
<div class="overlay" id="ov-detalle">
  <div class="modal" style="max-width:520px;padding:20px;">
    <div id="det-content"></div>
  </div>
</div>

<!-- Modal editar envío -->
<div class="overlay" id="ov-editar">
  <div class="modal" style="max-width:400px;">
    <div class="modal-title">EDITAR ENVÍO</div>
    <input type="hidden" id="ed-envio-id">
    <div class="field"><label>Nombre de la etiqueta</label><input id="ed-nombre"></div>
    <div class="field"><label>Cantidad de bultos</label><input id="ed-bultos" type="number" min="1"></div>
    <div id="ed-error" class="err-msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="cerrarEditar()">Cancelar</button>
      <button class="btn btn-accent" id="ed-btn" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ AUTH ═══
const SESS = (() => { try { return JSON.parse(localStorage.getItem('mble_session')||sessionStorage.getItem('mble_session')||'{}'); } catch(e){ return {}; } })();
const ST = SESS.session_token || '';
const HEADERS = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ST };

async function api(action, opts) {
  const method = opts && opts.body ? 'POST' : 'GET';
  const r = await fetch('/api/despachos?action=' + action, {
    method, headers: HEADERS, body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.msg || j.error || 'Error');
  return j;
}

// ═══ STATE ═══
let ENVIOS = [];
let DESPACHADOS = [];
let CATALOGO = [];
let _nvProy = null;
let _nvMueble = null;
let _nvProyBusc = null;
let _nvMueBusc = null;

// ═══ TOAST ═══
let _tt = null;
function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'toast-ok' : 'toast-err');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className = 'toast', 3000);
}

// ═══ HELPERS ═══
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function diasDesde(iso){ if (!iso) return null; return Math.floor((Date.now() - new Date(iso).getTime())/86400000); }
function fmtFecha(iso){ if (!iso) return '—'; return new Date(iso).toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

function cardClass(e) {
  if (e.produccion && e.produccion.evento !== 'completado') return 'err';
  if (!e.produccion) return '';
  const d = diasDesde(e.impreso_at);
  if (d != null && d > 10) return 'warn';
  return 'ok';
}

function prodText(e) {
  if (!e.produccion) return '<span style="color:var(--muted);">sin registro</span>';
  if (e.produccion.evento === 'completado') return '<span style="color:var(--green);">terminado ' + fmtFecha(e.produccion.fecha) + '</span>';
  return '<span style="color:var(--red);">NO TERMINADO</span>';
}

function barPct(e) { return e.bultos_total > 0 ? Math.round(e.bultos_escaneados / e.bultos_total * 100) : 0; }
function barColor(e) { return barPct(e) === 100 ? 'var(--green)' : 'var(--amber)'; }

// ═══ RENDER ═══
function render() {
  // KPIs
  const abiertos = ENVIOS.length;
  const impresosSinEsc = ENVIOS.filter(e => e.impreso).reduce((a, e) => a + (e.bultos_total - e.bultos_escaneados), 0);
  const noTerminados = ENVIOS.filter(e => e.produccion && e.produccion.evento !== 'completado').length;
  const viejos = ENVIOS.filter(e => e.impreso_at && diasDesde(e.impreso_at) > 30).length;
  document.getElementById('kpis').innerHTML =
    '<div class="kpi"><div class="kpi-val">' + abiertos + '</div><div class="kpi-lbl">Envíos abiertos</div></div>'
    + '<div class="kpi"><div class="kpi-val">' + impresosSinEsc + '</div><div class="kpi-lbl">Bultos sin escanear</div></div>'
    + '<div class="kpi"><div class="kpi-val" style="color:' + (noTerminados ? 'var(--red)' : 'var(--text)') + ';">' + noTerminados + '</div><div class="kpi-lbl">Sin terminar</div></div>'
    + '<div class="kpi"><div class="kpi-val" style="color:' + (viejos ? 'var(--orange)' : 'var(--text)') + ';">' + viejos + '</div><div class="kpi-lbl">&gt; 30 días</div></div>';

  // Alert band
  const noTerm = ENVIOS.filter(e => e.produccion && e.produccion.evento !== 'completado');
  if (noTerm.length) {
    const oldest = noTerm.reduce((a, e) => { const d = diasDesde(e.impreso_at || e.creado_en); return d > a ? d : a; }, 0);
    document.getElementById('alerta-band').innerHTML = '<div class="alerta-band">⚠ ' + noTerm.length + ' envío' + (noTerm.length > 1 ? 's' : '') + ' sobre muebles NO TERMINADOS en producción (el más viejo: ' + oldest + ' días)</div>';
  } else {
    document.getElementById('alerta-band').innerHTML = '';
  }

  // Col 1: Por preparar
  const preparar = ENVIOS.filter(e => !e.impreso);
  let h1 = '<div class="col-head"><span class="dot" style="background:var(--amber);"></span> POR PREPARAR <span class="cnt">' + preparar.length + '</span></div>';
  h1 += '<div class="newcard" onclick="abrirNuevoEnvio()"><div class="plus">+</div><div class="lbl">Nuevo envío</div></div>';
  h1 += preparar.map(e => cardHtml(e)).join('');
  document.getElementById('col-preparar').innerHTML = h1;

  // Col 2: Esperando camión — agrupados por obra
  const camion = ENVIOS.filter(e => e.impreso && e.bultos_escaneados < e.bultos_total);
  const groups = {};
  camion.forEach(e => {
    const k = (e.obra || 'Sin obra') + '|' + (e.cliente || '') + '|' + (e.odf_numero || '');
    if (!groups[k]) groups[k] = { obra: e.obra || 'Sin obra', cliente: e.cliente || '', odf: e.odf_numero || '', envios: [] };
    groups[k].envios.push(e);
  });
  let h2 = '<div class="col-head"><span class="dot" style="background:var(--green);"></span> ESPERANDO CAMIÓN <span class="cnt">' + camion.length + '</span></div>';
  Object.values(groups).forEach(g => {
    h2 += '<div class="ogroup"><div class="ogroup-head">' + esc(g.obra) + ' · ' + esc(g.cliente) + ' · ' + esc(g.odf) + '</div>';
    h2 += g.envios.map(e => cardHtml(e)).join('');
    h2 += '</div>';
  });
  if (!camion.length) h2 += '<div style="text-align:center;padding:20px;color:var(--muted);font-size:11px;">Sin envíos esperando</div>';
  document.getElementById('col-camion').innerHTML = h2;

  // Col 3: Despachado
  let h3 = '<div class="col-head"><span class="dot" style="background:var(--muted);"></span> DESPACHADO <span class="cnt">' + DESPACHADOS.length + '</span></div>';
  if (DESPACHADOS.length) {
    DESPACHADOS.forEach(e => {
      h3 += '<div class="drow">'
        + '<span class="mono" style="color:var(--amber);">' + esc(e.codigo || e.mf_n) + '</span>'
        + '<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(e.nombre) + '</span>'
        + '<span class="mono" style="color:var(--muted);">' + fmtFecha(e.fecha_salida) + '</span>'
        + '</div>';
    });
  } else {
    h3 += '<div style="text-align:center;padding:20px;color:var(--muted);font-size:11px;">Sin despachos recientes</div>';
  }
  document.getElementById('col-despachado').innerHTML = h3;
}

function cardHtml(e) {
  const cls = cardClass(e);
  const pct = barPct(e);
  const d = diasDesde(e.impreso_at);
  const fechaComp = e.fecha_comprometida;
  const atraso = fechaComp ? Math.max(0, Math.floor((Date.now() - new Date(fechaComp).getTime()) / 86400000)) : 0;
  return '<div class="dcard ' + cls + '" onclick="abrirDetalle(\'' + e.id + '\')">'
    + '<div class="dcard-cod">' + esc(e.codigo || e.mf_n) + (e.envio > 1 ? ' <span class="env-pill">ENVÍO ' + e.envio + '</span>' : '') + '</div>'
    + '<div class="dcard-name" title="' + esc(e.nombre) + '">' + esc(e.nombre) + '</div>'
    + '<div class="dcard-prod">' + prodText(e) + '</div>'
    + '<div class="dcard-bar"><div class="dcard-bar-fill" style="width:' + pct + '%;background:' + barColor(e) + ';"></div></div>'
    + '<div class="dcard-stats"><span>' + e.bultos_escaneados + '/' + e.bultos_total + '</span>'
    + (d != null ? '<span>' + d + 'd</span>' : '')
    + (fechaComp ? '<span' + (atraso > 0 ? ' style="color:var(--red);"' : '') + '>ent. ' + fmtFecha(fechaComp) + (atraso > 0 ? ' (-' + atraso + 'd)' : '') + '</span>' : '')
    + '</div></div>';
}

// ═══ DETALLE ═══
function abrirDetalle(envioId) {
  const e = [...ENVIOS, ...DESPACHADOS].find(x => x.id === envioId);
  if (!e) return;
  const el = document.getElementById('det-content');
  const noTerm = e.produccion && e.produccion.evento !== 'completado';
  const pct = barPct(e);

  let h = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'
    + '<div style="flex:1;"><div class="modal-title" style="margin-bottom:0;">' + esc(e.codigo || e.mf_n) + ' · ' + esc(e.nombre) + (e.envio > 1 ? ' <span style="color:var(--amber);">ENVÍO ' + e.envio + '</span>' : '') + '</div></div>'
    + '<span class="mono" style="font-size:11px;color:var(--muted);">' + e.bultos_escaneados + '/' + e.bultos_total + '</span>'
    + '<div style="width:60px;"><div class="dcard-bar" style="height:5px;"><div class="dcard-bar-fill" style="width:' + pct + '%;background:' + barColor(e) + ';"></div></div></div>'
    + '<span class="mono" style="font-size:11px;font-weight:700;">' + pct + '%</span></div>';
  if (noTerm) h += '<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:8px;margin-bottom:10px;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--red);">⚠ Este mueble NO está terminado en producción</div>';

  h += '<div class="det-info">'
    + '<div class="det-cell"><div class="lbl">Producción</div><div class="val">' + prodText(e) + '</div></div>'
    + '<div class="det-cell"><div class="lbl">Entrega comprometida</div><div class="val">' + (e.fecha_comprometida ? fmtFecha(e.fecha_comprometida) : '<span style="color:var(--muted);">—</span>') + '</div></div>'
    + '<div class="det-cell"><div class="lbl">Impreso</div><div class="val">' + (e.impreso ? fmtFecha(e.impreso_at) : '<span style="color:var(--muted);">no</span>') + '</div></div>'
    + '<div class="det-cell"><div class="lbl">Obra</div><div class="val">' + esc(e.obra || '—') + '</div></div>'
    + '</div>';

  // Actions
  h += '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">';
  if (!e.impreso) h += '<button class="btn btn-sm btn-accent" onclick="imprimirEnvio(\'' + e.id + '\')">Imprimir</button>';
  else h += '<button class="btn btn-sm" onclick="imprimirEnvio(\'' + e.id + '\')">Reimprimir</button>';
  if (e.bultos_escaneados === 0) {
    h += '<button class="btn btn-sm" onclick="editarEnvio(\'' + e.id + '\')">Editar</button>';
    h += '<button class="btn btn-sm" onclick="resetearEnvio(\'' + e.id + '\')">Resetear</button>';
    h += '<button class="btn btn-sm btn-danger" onclick="eliminarEnvio(\'' + e.id + '\')">Eliminar</button>';
  } else {
    h += '<button class="btn btn-sm" onclick="resetearEnvio(\'' + e.id + '\')">Resetear</button>';
  }
  h += '</div>';

  // Bultos grid
  h += '<div class="mono" style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">BULTOS</div>';
  h += '<div class="bulto-grid">';
  (e.bultos || []).forEach((b, i) => {
    const pos = '#' + String(i + 1).padStart(2, '0');
    h += '<div class="bulto' + (b.escaneado ? ' done' : '') + '">'
      + '<div class="bnum">' + pos + '</div>'
      + '<div class="bdesc" title="' + esc(b.descripcion) + '">' + esc(b.descripcion) + '</div>'
      + '<div class="bstatus">' + (b.escaneado
        ? '<span style="color:var(--green);">✓ ' + fmtFecha(b.fecha_escaneo) + '</span>'
        : '<button class="btn btn-sm" onclick="marcarBulto(\'' + b.id + '\',\'' + esc(b.descripcion) + '\')">Marcar</button>')
      + '</div></div>';
  });
  h += '</div>';

  el.innerHTML = h;
  document.getElementById('ov-detalle').classList.add('open');
}

function cerrarDetalle() { document.getElementById('ov-detalle').classList.remove('open'); }

// ═══ ACTIONS ═══
async function marcarBulto(id, desc) {
  if (!confirm('¿Marcar bulto ' + desc + ' como escaneado? Es un dato de salida física.')) return;
  try {
    await api('marcar-bulto', { body: { bulto_id: id } });
    toast('Bulto marcado ✓', true);
    cerrarDetalle();
    await cargarBoard();
  } catch (e) { toast(e.message, false); }
}

async function imprimirEnvio(envioId) {
  const e = [...ENVIOS, ...DESPACHADOS].find(x => x.id === envioId);
  if (!e) return;
  cerrarDetalle();

  if (!window.Etiquetas) { toast('Sistema de etiquetas no disponible', false); return; }

  var hoy = new Date();
  var fechaCorta = String(hoy.getDate()).padStart(2, '0') + '/' + String(hoy.getMonth() + 1).padStart(2, '0');
  var total = (e.bultos || []).length;
  var items = (e.bultos || []).map(function (b, i) {
    var pos = String(i + 1).padStart(2, '0');
    return {
      bulto: 'BULTO ' + pos + ' - ' + String(total).padStart(2, '0'),
      odf: e.odf_numero || '',
      cliente: e.cliente || '',
      mueble: (e.codigo || e.mf_n || '') + ' \u00B7 ' + (e.nombre || ''),
      fecha: fechaCorta,
      envio_num: e.envio,
      _qr: JSON.stringify({ pid: e.despacho_proyecto_id, bid: b.id, num: b.numero }),
    };
  });
  Etiquetas.imprimir('despacho-bulto', items);

  // Mark as printed
  if (!e.impreso) {
    try { await api('marcar-impreso', { body: { envio_id: e.id } }); } catch (_) {}
    await cargarBoard();
  }
}

function editarEnvio(envioId) {
  const e = ENVIOS.find(x => x.id === envioId);
  if (!e) return;
  cerrarDetalle();
  document.getElementById('ed-envio-id').value = envioId;
  document.getElementById('ed-nombre').value = e.nombre || '';
  document.getElementById('ed-bultos').value = e.bultos_total;
  document.getElementById('ed-error').textContent = '';
  document.getElementById('ed-btn').disabled = false;
  document.getElementById('ov-editar').classList.add('open');
}
function cerrarEditar() { document.getElementById('ov-editar').classList.remove('open'); }
async function guardarEdicion() {
  const envioId = document.getElementById('ed-envio-id').value;
  const nombre = document.getElementById('ed-nombre').value.trim();
  const bultos = parseInt(document.getElementById('ed-bultos').value);
  const errEl = document.getElementById('ed-error');
  errEl.textContent = '';
  if (!bultos || bultos < 1) { errEl.textContent = 'Bultos debe ser >= 1'; return; }
  document.getElementById('ed-btn').disabled = true;
  try {
    await api('editar-envio', { body: { envio_id: envioId, nombre, bultos } });
    toast('Envío editado ✓', true);
    cerrarEditar();
    await cargarBoard();
  } catch (e) {
    errEl.textContent = e.message;
    document.getElementById('ed-btn').disabled = false;
  }
}

async function resetearEnvio(envioId) {
  const e = [...ENVIOS, ...DESPACHADOS].find(x => x.id === envioId);
  if (!e || !confirm('¿Resetear envío "' + (e.nombre || e.codigo) + '"? Se desmarcan todos los bultos y la impresión.')) return;
  try {
    await api('resetear-envio', { body: { envio_id: envioId } });
    toast('Envío reseteado ✓', true);
    cerrarDetalle();
    await cargarBoard();
  } catch (e) { toast(e.message, false); }
}

async function eliminarEnvio(envioId) {
  const e = ENVIOS.find(x => x.id === envioId);
  if (!e || !confirm('¿Eliminar envío "' + (e.nombre || e.codigo) + '"? Se borran todos sus bultos.')) return;
  try {
    await api('eliminar-envio', { body: { envio_id: envioId } });
    toast('Envío eliminado ✓', true);
    cerrarDetalle();
    await cargarBoard();
  } catch (e) { toast(e.message, false); }
}

// ═══ NUEVO ENVÍO ═══
function abrirNuevoEnvio() {
  _nvProy = null; _nvMueble = null;
  document.getElementById('nv-proy-inp').value = '';
  document.getElementById('nv-mueble-inp').value = '';
  document.getElementById('nv-mueble-inp').disabled = true;
  document.getElementById('nv-nombre').value = '';
  document.getElementById('nv-bultos').value = '1';
  document.getElementById('nv-prod-aviso').innerHTML = '';
  document.getElementById('nv-error').textContent = '';
  document.getElementById('nv-btn').disabled = false;
  document.getElementById('nv-btn').textContent = 'Crear e imprimir';
  _initBuscadores();
  document.getElementById('ov-nuevo').classList.add('open');
}
function cerrarNuevo() { document.getElementById('ov-nuevo').classList.remove('open'); }

function _initBuscadores() {
  if (!_nvProyBusc) {
    _nvProyBusc = montarBuscador(
      document.getElementById('nv-proy-inp'),
      document.getElementById('nv-proy-drop'),
      CATALOGO,
      {
        codigo: p => p.numero,
        texto: p => p.nombre || p.obra || '',
        sub: p => [p.obra, p.cliente].filter(Boolean).join(' · '),
        buscar: p => [p.numero, p.nombre, p.obra, p.cliente].filter(Boolean).join(' '),
        onSelect: p => {
          _nvProy = p || null;
          _nvMueble = null;
          document.getElementById('nv-mueble-inp').value = '';
          document.getElementById('nv-mueble-inp').disabled = !p;
          document.getElementById('nv-prod-aviso').innerHTML = '';
          if (p && _nvMueBusc) _nvMueBusc.set(p.muebles || []);
          else if (_nvMueBusc) _nvMueBusc.set([]);
        }
      }
    );
  } else {
    _nvProyBusc.set(CATALOGO);
    _nvProyBusc.limpiar();
  }

  if (!_nvMueBusc) {
    _nvMueBusc = montarBuscador(
      document.getElementById('nv-mueble-inp'),
      document.getElementById('nv-mueble-drop'),
      [],
      {
        codigo: m => m.codigo,
        texto: m => m.nombre || '',
        buscar: m => [m.codigo, m.nombre].filter(Boolean).join(' '),
        onSelect: m => {
          _nvMueble = m || null;
          if (m) {
            document.getElementById('nv-nombre').value = m.nombre || '';
            var avEl = document.getElementById('nv-prod-aviso');
            if (m.produccion && m.produccion.evento === 'completado') {
              avEl.innerHTML = '<div style="background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:6px;padding:8px;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--green);">✓ Mueble terminado en producción</div>';
            } else if (m.produccion) {
              avEl.innerHTML = '<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:8px;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--red);">⚠ Mueble NO terminado — se puede despachar igual</div>';
            } else {
              avEl.innerHTML = '<div style="background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted);">Sin registro de producción</div>';
            }
          }
        }
      }
    );
  } else {
    _nvMueBusc.set(_nvProy ? (_nvProy.muebles || []) : []);
    _nvMueBusc.limpiar();
  }
}

async function crearEnvio() {
  const errEl = document.getElementById('nv-error');
  errEl.textContent = '';
  if (!_nvProy) { errEl.textContent = 'Elegí un proyecto'; return; }
  if (!_nvMueble) { errEl.textContent = 'Elegí un mueble'; return; }
  const nombre = document.getElementById('nv-nombre').value.trim();
  const bultos = parseInt(document.getElementById('nv-bultos').value);
  if (!bultos || bultos < 1) { errEl.textContent = 'Bultos debe ser >= 1'; return; }

  const btn = document.getElementById('nv-btn');
  btn.disabled = true; btn.textContent = 'Creando...';
  try {
    const r = await api('crear-envio', { body: {
      proyecto_id: _nvProy.id, mf_n: _nvMueble.id,
      nombre: nombre || _nvMueble.nombre || '', bultos,
    }});
    toast('Envío creado ✓', true);
    cerrarNuevo();
    await cargarBoard();
    // Auto-print
    if (r.envio) {
      const envio = ENVIOS.find(e => e.id === r.envio.id);
      if (envio) imprimirEnvio(envio.id);
    }
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Crear e imprimir';
  }
}

// ═══ DATA ═══
async function cargarBoard() {
  try {
    const r = await api('board');
    ENVIOS = r.envios || [];
    DESPACHADOS = r.despachados_recientes || [];
    render();
  } catch (e) {
    toast('Error cargando board: ' + e.message, false);
  }
}

async function cargarCatalogo() {
  try {
    const r = await api('catalogo');
    CATALOGO = r.proyectos || [];
  } catch (e) {
    toast('Error cargando catálogo: ' + e.message, false);
  }
}

// ═══ BOOT ═══
if (window.Etiquetas) Etiquetas.montarSelectorTamano(document.getElementById('etiq-sel-wrap'), 'despacho-bulto');
// Overlay close: gesto debe empezar y terminar en el overlay
['ov-nuevo','ov-detalle','ov-editar'].forEach(function(id){
  var fn = id === 'ov-nuevo' ? cerrarNuevo : id === 'ov-detalle' ? cerrarDetalle : cerrarEditar;
  var el = document.getElementById(id);
  var desdeOverlay = false;
  el.addEventListener('mousedown', function(e){ desdeOverlay = (e.target === el); });
  el.addEventListener('click', function(e){
    if (desdeOverlay && e.target === el) fn();
    desdeOverlay = false;
  });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarDetalle(); cerrarNuevo(); cerrarEditar(); } });
(async () => {
  await Promise.all([cargarBoard(), cargarCatalogo()]);
})();
</script>
</body>
